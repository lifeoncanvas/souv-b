# nginx site for the API: https://api.lichtsignaturesouvenirs.store -> the app on 127.0.0.1:8090.
#
# Install (as root), after pointing a DNS "A" record for api.lichtsignaturesouvenirs.store at this server:
#   cp deploy/nginx-api.conf /etc/nginx/sites-available/licht-api
#   ln -s /etc/nginx/sites-available/licht-api /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.lichtsignaturesouvenirs.store     # adds HTTPS and the http->https redirect

server {
    listen 80;
    server_name api.lichtsignaturesouvenirs.store;

    # Matches spring.servlet.multipart.max-request-size (40MB).
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
