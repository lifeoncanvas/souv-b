# Production (SPRING_PROFILES_ACTIVE=prod, set by deploy/licht-api.service).
#
# The live site runs on ONE domain: the storefront at https://lichtsignaturesouvenirs.store, and nginx on the same
# server forwards /api, /uploads and /sitemap.xml to this backend. These are the defaults for that setup; any
# environment variable (e.g. in /etc/licht/api.env) still overrides them.

# Links in emails (password reset, order confirmation) and redirects back from PayPal.
app.frontend-url=${FRONTEND_URL:https://lichtsignaturesouvenirs.store}

# Browsers only need CORS if the API is ever called from another domain; same-domain calls don't use it.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lichtsignaturesouvenirs.store,https://www.lichtsignaturesouvenirs.store}

# Uploaded customer logos are served at https://lichtsignaturesouvenirs.store/uploads/... through nginx.
app.storage.public-base-url=${UPLOAD_PUBLIC_BASE_URL:/uploads}
app.storage.upload-dir=${UPLOAD_DIR:/var/lib/licht/uploads}

# nginx on the same machine sets X-Forwarded-For / -Proto.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Never print email bodies (they contain reset links) in production logs.
app.mail.log-bodies=false
