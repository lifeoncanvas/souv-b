# LICHT Signature Souvenirs API configuration.
# Every value can be overridden by an environment variable or by backend/.env (git-ignored, see .env.example).
# Without DATABASE_URL the backend starts on an embedded local database with sample data (development only).

server.port=${PORT:8090}
# Trust X-Forwarded-For/-Proto only from a reverse proxy on a private network (Tomcat's default internal-proxy
# ranges), so rate limits see the real client IP and HTTPS is detected for HSTS. Use "none" when exposed directly.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

spring.application.name=licht-souvenirs-api
# Local secrets (Neon connection string, JWT secret...) live in backend/.env - never commit it.
spring.config.import=optional:file:.env[.properties]

# Database: Neon serverless PostgreSQL. Set DATABASE_URL to the Neon connection string
# (postgresql://user:password@ep-xxx.region.aws.neon.tech/neondb?sslmode=require);
# NeonDataSourceEnvironment converts it to JDBC settings.
spring.datasource.driver-class-name=org.postgresql.Driver
# Neon computes scale to zero; the first connection after idle can take a few seconds.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
# minimum-idle 0 closes idle connections so Neon compute can auto-suspend.
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Schema changes are versioned in src/main/resources/db/migration. A database created before Flyway
# (by ddl-auto=update) is baselined at version 1, so only later migrations run on it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Load lazy associations for a whole page in one query instead of one per product.
spring.jpa.properties.hibernate.default_batch_fetch_size=64

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=40MB

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Required: a long random value (>= 32 bytes). No default outside local mode, so a published key can never
# sign production tokens.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# ISO 4217 code the shop charges in; must match the "store" content block shown on the storefront.
app.currency=${STORE_CURRENCY:GBP}

app.mail.from=${MAIL_FROM:no-reply@licht-signature.local}
app.mail.admin-notify=${ADMIN_NOTIFY_EMAIL:}
# Without SMTP, emails are logged instead of sent. Bodies hold reset/verification links, so they are only
# logged when this is true (local mode turns it on).
app.mail.log-bodies=${MAIL_LOG_BODIES:false}

app.storage.upload-dir=${UPLOAD_DIR:./uploads}
app.storage.public-base-url=${UPLOAD_PUBLIC_BASE_URL:/uploads}
# Customer logos not referenced by any bag or order after this many hours are deleted.
app.storage.orphan-logo-hours=${ORPHAN_LOGO_HOURS:48}

# Cloudflare Turnstile secret. When set, sign-up, password reset, enquiries and checkout need a token
# (the frontend needs VITE_TURNSTILE_SITE_KEY). Leave empty to disable.
app.captcha.turnstile-secret=${TURNSTILE_SECRET_KEY:}

# Bank transfer and pay-on-confirmation are always available; PayPal appears once its credentials are set.
app.payment.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.payment.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
# "sandbox" for testing, "live" for real payments.
app.payment.paypal.mode=${PAYPAL_MODE:sandbox}
# Developer dashboard -> your app -> Webhooks. Required to receive capture/refund events.
app.payment.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
app.payment.paypal.brand-name=${PAYPAL_BRAND_NAME:LICHT Signature Souvenirs}

# Unpaid PENDING orders are cancelled and restocked after this long.
app.orders.unpaid-expiry-hours=${UNPAID_ORDER_EXPIRY_HOURS:168}
# An abandoned PayPal checkout releases its stock after this many minutes.
app.orders.paypal-expiry-minutes=${PAYPAL_ORDER_EXPIRY_MINUTES:60}
# Largest quantity of one product per order; larger quantities go through bulk enquiries.
app.orders.max-quantity-per-product=${MAX_QUANTITY_PER_PRODUCT:100}
# Guest bags untouched for this many days are deleted.
app.orders.guest-cart-days=${GUEST_CART_DAYS:30}

app.shipping.standard-fee=${SHIPPING_STANDARD_FEE:8.00}
app.shipping.express-fee=${SHIPPING_EXPRESS_FEE:18.00}
app.shipping.free-threshold=${SHIPPING_FREE_THRESHOLD:150.00}

# Seeds placeholder catalogue/content only into empty tables, so it is safe to leave on.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${ADMIN_EMAIL:admin@licht.local}
app.seed.admin-password=${ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/api/docs
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/api/docs/openapi.json
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
