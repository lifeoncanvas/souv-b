# Offline mode: embedded H2 file database (SPRING_PROFILES_ACTIVE=local). The backend also switches to these
# settings by itself when DATABASE_URL is not set (see NeonDataSourceEnvironment).
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/licht;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Local development only; any other profile must set JWT_SECRET.
app.jwt.secret=${JWT_SECRET:local-profile-only-secret-licht-signature-souvenirs}
app.mail.log-bodies=true

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
